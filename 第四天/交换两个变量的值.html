<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- js是一个编程语言，有很大逻辑性在里面 -->
  <script>
    /* 1.我们需要一个；临时变量 
  2.把apple1给我们的临时变量
  3.再把apple2给apple1
  4.把临时变量的值给apple2*/
    var temp;
    var apple1 = '青苹果';
    var apple2 = '红苹果';
    /* ;把右边给左边 */
    temp = apple1;
    apple1 = apple2;
    apple2 = temp;
  </script>
</head>
