<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    // 1.更新变量
    var name = '小于';
    console.log(name);
    // console.log是显示在控制器上；
    name = 'xiaoxiao';
    console.log(name);
    // 2.声明多个变量
    var name = 'xiaoxiao',
      gz = '1000',
      xuehao = 23;
    console.log()
    // 3.声明变量的特殊情况
    // 只声明，不赋值
    // 结果是undefined，未定义
    var sex;
    console.log(sex);
      // 不声明，直接赋值,可以直接显示，最好要声明
        qq = 110;
        console.log(qq);
    // 不声明，不赋值，直接使用,发生报错
    console.log(tel);
  </script>
</head>

<body>
  <h2>变量语法扩展</h2>
  <h4>更新变量</h4>
  一个变量被重新赋值后，他原本的值就会被覆盖，变量将以最后一次赋值为主<br>
  <h4>声明多个变量</h4>
  同时声明多个变量，只用写一个var,多个变量名用逗号隔开。<br>
  <h4>声明变量的特殊情况</h4>
  只声明不赋值:结果是undefined，未定义<br>
</body>

</html>
