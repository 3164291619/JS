  <h2>变量命名规范</h2>
  1.由大写字母、小写字母、数字、下划线-，美元符号组成<br>
<div>严格区分大小写，变量名的大写和小写是两个变量名</div>
<div>不能以数字开头</div>
<div>不能是关键字、保留字</div>
<div>变量名必须有意义</div>
<div>遵循驼峰命名法，首字母小写，后面单词的首字母需要大写。myFistName</div>
